backend:
  name: github
  repo: MangoXiaoda/MangoXiaoda.github.io
  branch: main
  # GitHub Pages production editing needs an OAuth proxy.
  # base_url: https://your-oauth-proxy.example.com

local_backend: true
publish_mode: editorial_workflow
media_folder: static/img/uploads
public_folder: /img/uploads
locale: zh_Hans

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    thumbnail: cover
    folder: content/posts
    create: true
    path: "{{slug}}/index"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "posts/{{slug}}/"
    fields:
      - label: 草稿
        name: draft
        widget: boolean
        default: false
      - label: 标题
        name: title
        widget: string
      - label: 发布时间
        name: date
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ssZ"
      - label: 更新时间
        name: lastmod
        widget: datetime
        required: false
        format: "YYYY-MM-DDTHH:mm:ssZ"
      - label: 作者
        name: author
        widget: string
        required: false
        default: "夏天去旅行"
      - label: 封面
        name: cover
        widget: image
        default: "/img/sample-cover.svg"
        required: false
      - label: 分类
        name: categories
        widget: list
        required: false
        field:
          label: 分类
          name: category
          widget: string
      - label: 标签
        name: tags
        widget: list
        required: false
        field:
          label: 标签
          name: tag
          widget: string
      - label: 正文
        name: body
        widget: markdown

  - name: about
    label: 关于页
    files:
      - name: intro
        label: 关于这个博客
        file: content/about/intro.md
        fields:
          - label: 标题
            name: title
            widget: string
          - label: 发布时间
            name: date
            widget: datetime
            required: false
          - label: 草稿
            name: draft
            widget: boolean
            default: false
          - label: 正文
            name: body
            widget: markdown
