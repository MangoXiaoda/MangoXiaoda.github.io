baseURL = "https://mangoxiaoda.github.io/"
title = "夏天去旅行"
theme = "hugo-theme-dream"
defaultContentLanguage = "zh"
locale = "zh-cn"
hasCJKLanguage = true
enableRobotsTXT = true
summaryLength = 70

[pagination]
pagerSize = 12

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[taxonomies]
category = "categories"
tag = "tags"

[params]
lightTheme = "emerald"
darkTheme = "forest"
author = "夏天去旅行"
description = "记录生活、旅行和技术的个人博客。"
avatar = "img/avatar.jpg"
headerTitle = "夏天去旅行"
motto = "✦ blog ✦"
siteStartYear = 2026
favicon = "<link rel=\"icon\" href=\"/img/avatar.jpg\" type=\"image/jpeg\" />"
rss = true
stickyNav = false
reorderNavItems = ["posts", "categories", "tags", "search", "about"]
collapseNavItems = ["posts", "categories", "tags"]
showTableOfContents = true
imageZoomableInPost = true
showSummaryCoverInPost = true
showPrevNextPost = true

# Waline is enabled after you deploy a Waline server.
# waline = true
# walineServer = "https://your-waline-server.vercel.app"

[params.experimental]
jsDate = true
jsDateFormat = "yyyy-MM-dd"
